<div class="ecom-element ecom-collection ecom-collection__product" @setactive="setActiveElement">
    <div class="ecom-collection__product-wrapper">
        <div class="ecom-collection__product-container ecom-swiper-a11y-host"
            :class="['ecom-collection__product-container_' + data?.template]">
            <button
                v-if="$helpers.hasAutoplayToggle(data.settings)"
                type="button"
                class="ecom-swiper-autoplay-toggle"
                :data-position="data.settings?.a11y_autoplay_control_position || 'bottom-right'"
                data-state="playing"
                data-label-pause="Pause automatic slide show"
                data-label-play="Start automatic slide show"
                aria-label="Pause automatic slide show"
            >
                <svg class="ecom-swiper-autoplay-toggle__pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
                <svg class="ecom-swiper-autoplay-toggle__play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="ecom-collection__product-main"
                :class="[{ 'ecom-swiper-container': layout === 'slider' }, 'ecom-collection_product_template_' + data?.template]"
                :data-pagination="data.settings.pagination_type"
                :data-week="lang(data.settings.text_week, 'text_week')"
                :data-day="lang(data.settings.text_day, 'text_day')"
                :data-hour="lang(data.settings.text_hour, 'text_hour')"
                :data-minute="lang(data.settings.text_minute, 'text_minute')"
                :data-second="lang(data.settings.text_second, 'text_second')" :data-sale="lang(data.settings.bage_sale)"
                :data-review-platform="liquid('review_platform')" v-html="productItemsHtml"
                :data-countdown-shows="shows_countdown" :data-translate="canMultipleLanguages" />
            <div v-if="isNavigation && isCombined == 'combine'" class="ecom-swiper-navigation"
                :data-navigator-type="isCombined == 'combine'">
                <div class="ecom-flex-center">
                    <button v-show="isArrow()" class="ecom-swiper-button ecom-swiper-button-prev"
                        v-html="data.settings.slider_prev_icon" />
                    <div v-show="isPagination()" class="ecom-swiper-pagination" />
                    <button v-show="isArrow()" class="ecom-swiper-button ecom-swiper-button-next"
                        v-html="data.settings?.slider_next_icon" />
                </div>
            </div>
            <div v-if="isNavigation && !(isCombined == 'combine')" v-show="isArrow()"
                class="ecom-swiper-navigation-position">
                <button :style="sliderNav" class="ecom-swiper-button ecom-swiper-button-prev"
                    v-html="data.settings?.slider_prev_icon" />
                <button :style="sliderNav" class="ecom-swiper-button ecom-swiper-button-next"
                    v-html="data.settings?.slider_next_icon" />
            </div>
            <div v-if="isNavigation && !(isCombined == 'combine')" v-show="isPagination()"
                class="ecom-swiper-pagination-position ecom-swiper-pagination" />
        </div>
        <div v-if="data?.template === 'collection'" class="ecom-collection__product-loading ecom-dn">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                style="margin: auto; background: none; display: block; shape-rendering: auto;" width="48px"
                height="48px" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid">
                <path d="M10 50A40 40 0 0 0 90 50A40 42 0 0 1 10 50" fill="#0a0a0a" stroke="none">
                    <animateTransform attributeName="transform" type="rotate" dur="0.5434782608695652s"
                        repeatCount="indefinite" keyTimes="0;1" values="0 50 51;360 50 51"></animateTransform>
                </path>
            </svg>
        </div>
    </div>
</div>
